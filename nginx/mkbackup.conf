# mkbackup detras de TLS.
#
# El panel escucha SOLO en 127.0.0.1 y habla HTTP en claro: lista nombres, IPs
# y empresas de toda la flota, y el login viaja en el cuerpo del POST. Este
# proxy es lo que hace que se pueda abrir desde fuera sin repartir todo eso.
#
# X-Forwarded-For es imprescindible, no cosmetico: sin el, mkbackup ve todas
# las peticiones viniendo de 127.0.0.1, el freno a la fuerza bruta se convierte
# en un cubo compartido (cinco fallos de cualquiera dejan fuera a todos) y el
# registro de accesos no sirve para nada. Hay que declarar 127.0.0.1 en
# web.proxies_de_confianza para que mkbackup se fie de esta cabecera.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    # Nada por el puerto 80 salvo mandar al 443: si alguien entra por HTTP, la
    # clave que escriba despues ya iria en claro.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/mkbackup.crt;
    ssl_certificate_key /etc/nginx/tls/mkbackup.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # El panel ya manda la suya; esta es por si se sirve algo que no pasa por
    # el (una pagina de error de nginx, por ejemplo).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # La importacion admite .csv y .xlsx, y el fondo del login una imagen.
    client_max_body_size 32m;

    # La copia completa del servidor, en los dos sentidos. Tiene sus propios
    # limites porque no se parece a nada mas de este panel: son cientos de
    # megas y tarda minutos.
    #
    # request_buffering off para que la subida pase directa al panel, que la
    # vuelca a disco segun llega. Con el buffering puesto, nginx se guarda
    # ANTES una copia entera en su propio directorio temporal: el doble de
    # disco y el doble de espera, para nada.
    location ~ ^/ajustes/mudanza {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2g;
        proxy_request_buffering off;
        # Empaquetar o desempaquetar el historico de una flota grande son
        # minutos, y las cabeceras no salen hasta que esta hecho.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El panel se refresca solo; sin esto la conexion se reabre sin parar.
        proxy_read_timeout 75s;
    }
}
